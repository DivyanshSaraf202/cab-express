{% extends "base.html" %}
{% block title %}Sign In / Register - CabExpress{% endblock %}

{% block content %}
<main style="display: flex; justify-content: center; padding-top: 3rem;">
    <div class="card" style="width: 100%; max-width: 420px;">
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem;">
            <button type="button" id="tabLogin" onclick="switchAuthMode('login')" class="btn btn-primary btn-block">Sign In</button>
            <button type="button" id="tabRegister" onclick="switchAuthMode('register')" class="btn btn-secondary btn-block">Register</button>
        </div>

        <form method="POST" action="/auth">
            <input type="hidden" id="authAction" name="action" value="login">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="form-group" id="emailGroup" style="display: none;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="form-group" id="roleGroup" style="display: none;">
                <label>Account Type</label>
                <div style="display: flex; gap: 1.5rem; margin-top: 0.25rem;">
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="role" value="passenger" checked> Passenger
                    </label>
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="role" value="driver"> Driver
                    </label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
        </form>
    </div>
</main>

<script>
    function switchAuthMode(mode) {
        document.getElementById('authAction').value = mode;
        const emailGroup = document.getElementById('emailGroup');
        const roleGroup = document.getElementById('roleGroup');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');

        if (mode === 'register') {
            emailGroup.style.display = 'block';
            roleGroup.style.display = 'block';
            emailInput.required = true;
            submitBtn.innerText = 'Create Account';
            tabLogin.className = 'btn btn-secondary btn-block';
            tabRegister.className = 'btn btn-primary btn-block';
        } else {
            emailGroup.style.display = 'none';
            roleGroup.style.display = 'none';
            emailInput.required = false;
            submitBtn.innerText = 'Sign In';
            tabLogin.className = 'btn btn-primary btn-block';
            tabRegister.className = 'btn btn-secondary btn-block';
        }
    }
</script>
{% endblock %}
